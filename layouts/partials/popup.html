{{- with site.Params.popup }}
<div class="popup" id="welcome-popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" hidden>
  <div class="popup-box">
    <button class="popup-close" type="button" aria-label="סגירה">×</button>
    {{ with .image }}<img src="{{ partial "url.html" . }}" alt="">{{ end }}
    <div class="popup-body">
      <h2 id="popup-title">{{ .title }}</h2>
      <p>{{ .text | markdownify }}</p>
      <a class="btn" href="{{ .link }}">{{ .button }}</a>
    </div>
  </div>
</div>
{{- end }}

{{ define "main" }}
<article class="page post">
  <a class="back" href="{{ partial "url.html" "/blog/" }}">{{ if eq .Params.lang "en" }}← All posts{{ else }}→ לכל הפוסטים{{ end }}</a>
  <h1>{{ .Title }}</h1>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
  {{- with .Params.image }}<img class="post-image" src="{{ partial "url.html" . }}" alt="">{{ end }}
  {{ .Content }}
</article>
{{ end }}
